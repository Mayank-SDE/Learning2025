services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vc
      RABBITMQ_DEFAULT_PASS: vcpass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} ;
      mc mb -p local/${MINIO_BUCKET} || true ;
      mc anonymous set download local/${MINIO_BUCKET} || true ;
      "

  server:
    build: ./server
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      createbucket:
        condition: service_started
    ports:
      - "8089:8089"

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # ---------- NEW: client (Production, Nginx) ----------
  client:
    build:
      context: ./vision-craft-client
      dockerfile: Dockerfile
      args:
        # Vite needs API base at build time
        VITE_API_URL: http://server:8089
    depends_on:
      server:
        condition: service_started
    ports:
      - "8080:80"
